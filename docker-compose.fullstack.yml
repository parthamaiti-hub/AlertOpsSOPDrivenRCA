services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false

  app:
    build:
      context: .
      dockerfile: Dockerfile.fullstack
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_started
    command: >
      sh -c "
        uv run python -m backend.main web &
        uv run python -m backend.main eventprocessing &
        uv run python -m backend.main identifySOP &
        uv run python -m backend.main executeSOP &
        uv run python -m backend.main validateRCA &
        wait
      "

volumes:
  mongo_data:
  chroma_data:
